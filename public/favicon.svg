<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18122B" />
      <stop offset="100%" stop-color="#0F081D" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#7928CA" stroke-width="2.5" />
  
  <!-- Stylized Geometric "M" Monogram -->
  <path d="M 32 94 V 38 L 56 68 L 72 68 L 96 38 V 94" 
        fill="none" 
        stroke="url(#purpleGrad)" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
        
  <path d="M 32 94 V 38 L 56 68 L 72 68 L 96 38 V 94" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Target / Performance Tracking Neon Dot -->
  <circle cx="64" cy="88" r="5" fill="#10B981" />
</svg>
